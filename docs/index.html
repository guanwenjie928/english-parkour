<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>英语跑酷课堂游戏</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #2b1e10; }
    @font-face {
      font-family: 'PixelChinese';
      src: local('SimHei'), local('Microsoft YaHei'), local('Noto Sans SC');
      /* 中文字符回退：系统黑体提供可读性，尺寸按像素字体比例缩小 */
    }
    #game-container { width: 100vw; height: 100vh; }
    /* 像素字体全局可用 */
    :root {
      --font-pixel: 'Press Start 2P', 'PixelChinese', monospace;
    }
  </style>
  <script type="module" crossorigin src="/parkour/assets/index-B7-j6_vh.js"></script>
</head>
<body>
  <div id="game-container"></div>
  <script>
    // 本地模式不加载 socket.io（纯单机体验）
    const isLocalMode = location.search.includes('local=1') || location.hostname === 'localhost' || location.hostname.includes('github.io');
    if (!isLocalMode) {
      const script = document.createElement('script');
      script.src = '/socket.io/socket.io.js';
      document.head.appendChild(script);
    }
  </script>
</body>
</html>
